<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - RetroBite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="{{ url_for('home') }}" class="logo">RetroBite</a>
        </div>
        <ul class="nav-links">
            <li><a href="{{ url_for('menu') }}">Back to Menu</a></li>
        </ul>
    </nav>

    <main class="container">
        <div class="retro-form" style="max-width: 600px;">
            <h1 class="form-title">Order Summary</h1>

            {% if basket_items %}
            <div class="checkout-summary">
                <ul class="order-list-summary" style="list-style: none; padding: 0;">
                    {% for item in basket_items %}
                    <li style="display: flex; justify-content: space-between; border-bottom: 1px dashed #ccc; padding: 0.5rem 0;">
                        <span><strong>{{ item.name }}</strong> (x{{ item.qty }})</span>
                        <span>${{ "%.2f"|format(item.price * item.qty) }}</span>
                    </li>
                    {% endfor %}
                </ul>

                <div style="text-align: right; margin-top: 1.5rem; font-size: 1.5rem;">
                    <strong>Total: ${{ total_price }}</strong>
                </div>

                <div style="margin-top: 2rem; display: flex; gap: 1rem;">
                    <button id="confirm-order-btn" class="retro-btn" style="flex: 1;">Confirm Order</button>
                    <a href="{{ url_for('menu') }}" class="retro-btn" style="flex: 1; text-align: center; background: #666; border-color: #666;">Cancel</a>
                </div>
            </div>
            {% else %}
            <div style="text-align: center; padding: 2rem;">
                <p>Your basket is empty.</p>
                <a href="{{ url_for('menu') }}" class="retro-btn">View Menu</a>
            </div>
            {% endif %}
        </div>
    </main>

    <script>
        document.getElementById('confirm-order-btn')?.addEventListener('click', async () => {
            const btn = document.getElementById('confirm-order-btn');
            btn.disabled = True;
            btn.innerText = "Processing...";

            try {
                const response = await fetch("{{ url_for('create_order') }}", { method: 'POST' });
                const data = await response.json();

                if (data.success) {
                    alert("Order Confirmed! Order ID: " + data.order_id);
                    window.location.href = "{{ url_for('my_orders') }}";
                } else {
                    alert("Order failed: " + (data.error || "Unknown error"));
                    btn.disabled = False;
                    btn.innerText = "Confirm Order";
                }
            } catch (err) {
                alert("Connection error. Try again.");
                btn.disabled = False;
                btn.innerText = "Confirm Order";
            }
        });
    </script>
</body>

</html>
